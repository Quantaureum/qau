# Gitleaks configuration for the Quantaureum publish line.
#
# Everything below is a deliberate allowlist for SYNTHETIC test fixtures —
# verified against the real key material (the audit's true-key reverse
# lookup over full history is zero-hit); no live credentials live in this
# repository. Keep entries narrow: file-scoped with a stated reason.

[extend]
# Start from gitleaks' default ruleset.
# Without useDefault = true this file declares no detection rules at all, so
# `gitleaks detect` always exits clean no matter what is committed — the CI
# secret-scan step would be a no-op (audit node/ci-gitleaks-no-rules).
useDefault = true

[allowlist]
description = "Synthetic test fixtures and documented devnet conventions"
paths = [
  '''log/log_test\.go''',
  '''cmd/validator_keygen_ceremony/main_test\.go''',
  # websocket WG test keys are IETF test vectors (run-19 scan hit)
  '''rpc/websocket_r15_h02_wg_test\.go''',
  # rust SDK account test fixtures (run-19 scan hit)
  '''sdks/rust-sdk/src/accounts/account\.rs''',
]
regexes = [
  # The devnet-only deterministic share password, public by design
  # (QUANTAUREUM-DEV-* convention, mirrors the dev-chain seeds).
  '''QUANTAUREUM-DEV-''',
  # RFC 8439 / IETF sample nonce test vector ("the sample nonce") —
  # the canonical ChaCha20/Poly1305 test input, not a credential.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # rlpx handshake doc comment naming the mac/aes key VARIABLES
  # (run-19 gitleaks false positive on p2p/rlpx/conn_test.go).
  '''IngressMAC=macKeyBA''',
  # Companion line of the same rlpx doc comment block (adjacent line
  # re-triggered generic-api-key on the IngressAES variable assignment).
  '''IngressAES=encKeyBA''',
  # Canonical sequential placeholder hex (0x0123456789abcdef repeated)
  # used as a documented example in the rust-sdk README and as a unit-test
  # fixture in validation.rs; sequential by construction, not a credential.
  # 32-char prefix: matches any continuation of the sequence while keeping
  # this file free of 40/64-char hex literals (push-audit scanner noise).
  '''0123456789abcdef0123456789abcdef''',
  # Go identifier captured as the "secret" from the QTD protocol doc
  # comment in wallet/tss/qtd/qtd_protocol.go (keyword-triggered
  # generic-api-key match on a function name, not a credential).
  '''computeZ0Contribution''',
]
