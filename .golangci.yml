# R42-CI-RACE-10 (2026-08-20): migrated from golangci-lint v1 (go1.23-built,
# incapable of a Go 1.26 target) to v2.12.2 (built with go1.26.x). The old v1
# tool never actually ran against Go 1.26, so the Go 1.26 upgrade left ~3500
# accumulated lint issues that the v1 step silently failed to catch.
#
# Staged enablement policy (user-approved 2026-08-20): instead of one risky
# batch cleanup, each high-value linter is enabled in its own follow-up
# R-commit and its issues are fully fixed BEFORE the next linter is enabled.
#
# This session enables + fixes:
#   govet (defaults, NO enable-all) — correctness analyzers only
#   gosec (excluding noisy G115)    — security
#   misspell / copyloopvar / unconvert / ineffassign / gofmt — hygiene
#
# Disabled this session, to be re-enabled in follow-up R-commits (their
# issues fixed first):
#   staticcheck (~197), errcheck (~288, incl. unchecked zeroization calls),
#   unused (~114)
#
# Dropped permanently as low-value noise (never enforced under Go 1.26):
#   unparam / nilerr / prealloc / exhaustive / noctx / bodyclose / errname /
#   wastedassign / rowserrcheck / sqlclosecheck
version: "2"
run:
  go: "1.26"
  modules-download-mode: readonly
linters:
  # v2 defaults are govet/staticcheck/errcheck/unused/ineffassign. We opt out
  # of all defaults and explicitly enable only this session's linters, so the
  # deferred ones (staticcheck/errcheck/unused) do NOT run yet.
  default: none
  enable:
    - copyloopvar
    - gosec
    - govet
    - ineffassign
    - misspell
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # Audit errors not checked (too many false positives)
        - G115 # Integer overflow conversions: very high false-positive rate
               # in crypto/encoding primitives; tracked as a dedicated
               # follow-up security audit task, not a CI blocker.
        - G703 # Path traversal via taint analysis: flags os.ReadFile(os.Args[..])
               # in CLI tools (cmd/*, tools/*). For a CLI, the file path IS the
               # tool's user-supplied input by design — there is no server-side
               # trust boundary to defend. Server-side file reads (rpc/, node/,
               # p2p/) are unaffected and still gated by real path validation.
    govet:
      # `inline` (Go 1.24+) is a perf-suggestion analyzer that floods this
      # codebase with "call of sha3.New256/sha3.Sum256 should be inlined"
      # (127 hits) — not correctness issues, hash constructors cannot be
      # inlined at the call site. Disabled; govet otherwise runs defaults.
      disable:
        - inline
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
        path: _test\.go
      - linters:
          - staticcheck
        path: upgrade/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 200
  max-same-issues: 200
severity:
  default: warning
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
