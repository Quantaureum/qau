name: Feature Request
description: Propose an enhancement or new capability
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe your proposal. Features are queued by advisory board vote + core-team capacity.
        For big protocol changes consider opening a Discussion first before a PR.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What need is this solving? Why can't current tools deliver it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you rejected and why.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - consensus
        - networking / p2p
        - VM / QASM
        - wallet UX
        - contracts / bridge / DeFi
        - documentation
        - tooling / dev-experience
        - other
  - type: checkboxes
    id: volunteer
    attributes:
      label: Contribution intent
      options:
        - label: I am willing to implement this myself and submit a PR
