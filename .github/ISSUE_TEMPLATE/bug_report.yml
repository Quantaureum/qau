name: Bug Report
description: Report a defect in the Quantaureum codebase (node, consensus, VM, p2p)
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Before continuing, please make sure you've:
        - Searched existing open/closed issues to avoid duplicates
        - Confirmed this is a code defect, not a usage question (for usage, see the docs under `docs/` or start a Discussion)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its observed impact.
      placeholder: |
        Example: After upgrading to a specific commit, qaud stops proposing blocks and logs the following error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: The behavior you expected under these circumstances.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Paste any relevant logs (journalctl, qaud stdout, stderr).
        **Never paste private keys, keystore files, or passwords.**
      render: shell
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic steps that reliably trigger the bug.
      placeholder: |
        1. Build qaud at commit ...
        2. Start a 6-node localtest chain with ...
        3. Submit a staking tx ...
        4. Observe error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Quantaureum commit / version
      description: |
        Commit hash or release tag. From repo root: `git rev-parse HEAD`.
        If you have a deployed binary: `strings /usr/local/bin/qaud | grep 'mod.*quantaureum' | head -1`
      placeholder: e.g., 1746480
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - consensus (QPOS / finality / validator management)
        - p2p (networking / mTLS / peer discovery)
        - qvm (QVM execution / QASM contracts)
        - mempool
        - encoding / crypto primitives
        - wallet / keystore
        - RPC / HTTP / JSON-RPC
        - contracts (Solidity or QASM)
        - toolbox / CLI (deploy_qswap, qswap_smoke, etc)
        - documentation / plans
        - other
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - production mainnet (chainId 1668)
        - public testnet
        - local dev / localtest
        - CI / automated test
        - other (explain in logs above)
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have removed **any** private keys, keystore, or wallet secrets from logs before submitting.
          required: true
        - label: I have searched existing issues to confirm this is not a duplicate.
          required: true
