[package]
# Quantaureum Rust SDK source, version 1.0.0.
name = "quantaureum-sdk"
version = "1.0.0"
edition = "2021"
description = "Rust SDK for interacting with the Quantaureum quantum-safe blockchain"
license = "Apache-2.0"
repository = "https://github.com/quantaureum/qau/tree/main/sdks/rust-sdk"
keywords = ["blockchain", "quantaureum", "sdk", "crypto"]
categories = ["cryptography", "api-bindings"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
primitive-types = { version = "0.12", features = ["serde"] }
rlp = "0.5"
hex = "0.4"
bip39 = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
bytes = "1.11.1"
hmac = "0.12"

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
